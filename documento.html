<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos | Medi CLOUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Layout */
        .layout-docs {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar-docs {
            width: 280px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            height: calc(100vh - 70px);
            position: sticky;
            top: 70px;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 10px 0 5px 10px;
            font-weight: 600;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .sidebar-item:hover {
            background: var(--primary-light);
            border-color: #dbeafe;
        }

        .sidebar-item.ativo {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .sidebar-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .sidebar-info {
            flex: 1;
        }

        .sidebar-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .sidebar-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .sidebar-count {
            background: var(--border);
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Main Content */
        .main-docs {
            flex: 1;
            padding: 24px;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .module-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .module-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: var(--radius);
            border: none;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .btn-icon {
            padding: 8px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-icon:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Filters & Search */
        .filters-bar {
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .filter-select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            color: var(--text-main);
            cursor: pointer;
        }

        /* Table */
        .data-table-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .table-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .action-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        /* Form Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            transform: translateY(10px);
            transition: var(--transition);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* Loading & Toast */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: var(--transition);
        }

        .loading-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--success);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast-icon {
            font-size: 1.2rem;
            color: var(--success);
        }

        .toast.error .toast-icon {
            color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        @media (max-width: 900px) {
            .sidebar-docs {
                width: 70px;
                padding: 20px 10px;
            }

            .sidebar-info,
            .sidebar-count {
                display: none;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check toast-icon"></i>
        <span id="toastMsg">Operação realizada com sucesso!</span>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalForm">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Registro</h3>
                <button class="modal-close" onclick="fecharModal()">&times;</button>
            </div>
            <form id="formDinamico" onsubmit="salvarRegistro(event)">
                <div class="form-grid" id="formGrid"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="layout-docs">
        <!-- Sidebar -->
        <aside class="sidebar-docs" id="sidebarDocs">
            <div class="sidebar-title">Módulos</div>
            <!-- Renderizado via JS -->
        </aside>

        <!-- Main Content -->
        <main class="main-docs">
            <div class="module-header">
                <h2 id="moduleTitle">Prontuários</h2>
                <div class="module-actions">
                    <button class="btn btn-secondary" onclick="exportarDados()"><i class="fa-solid fa-download"></i>
                        Exportar</button>
                    <button class="btn btn-primary" onclick="abrirFormulario()"><i class="fa-solid fa-plus"></i>
                        Novo</button>
                </div>
            </div>

            <div class="filters-bar">
                <input type="text" class="search-input" placeholder="Buscar por nome, código ou descrição..."
                    oninput="filtrarDados(this.value)">
                <select class="filter-select" id="filtroStatus" onchange="filtrarDados()">
                    <option value="">Todos os status</option>
                    <option value="ativo">Ativo</option>
                    <option value="pendente">Pendente</option>
                    <option value="arquivado">Arquivado</option>
                </select>
                <select class="filter-select" id="filtroData" onchange="filtrarDados()">
                    <option value="">Período</option>
                    <option value="7">Últimos 7 dias</option>
                    <option value="30">Últimos 30 dias</option>
                    <option value="90">Últimos 3 meses</option>
                </select>
            </div>

            <div class="data-table-container">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <i class="fa-regular fa-folder-open"></i>
                    <h3>Nenhum registro encontrado</h3>
                    <p>Adicione um novo registro ou ajuste os filtros.</p>
                </div>
            </div>
        </main>
        <div class="logout-btn" onclick="sair()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
        </div>
    </div>

    <script>
        const API = "http://localhost:10000/api";
        // produção:
        // const API = "https://medicloud-backend-wy7s.onrender.com/api";

        const TOKEN = localStorage.getItem("token");

        const MODULOS = {
            prontuarios: {
                nome: "Prontuários",
                icone: "fa-file-medical",
                desc: "Registros clínicos completos",
                endpoint: "/documentos",
                tipoDocumento: "Prontuário",
                cols: ["Paciente", "Tipo", "Conteúdo", "Data", "Status", "Ações"],
                form: [
                    { id: "pacienteId", label: "Paciente", type: "select-pacientes", required: true },
                    { id: "conteudo", label: "Conteúdo", type: "textarea", full: true, required: true },
                    { id: "status", label: "Status", type: "select", options: ["Ativo", "Pendente", "Arquivado"] }
                ]
            },

            exames: {
                nome: "Exames",
                icone: "fa-microscope",
                desc: "Resultados laboratoriais",
                endpoint: "/documentos",
                tipoDocumento: "Exame",
                cols: ["Paciente", "Tipo", "Conteúdo", "Data", "Status", "Ações"],
                form: [
                    { id: "pacienteId", label: "Paciente", type: "select-pacientes", required: true },
                    { id: "conteudo", label: "Resultado do exame", type: "textarea", full: true, required: true },
                    { id: "status", label: "Status", type: "select", options: ["Ativo", "Pendente", "Arquivado"] }
                ]
            },

            prescricoes: {
                nome: "Prescrições",
                icone: "fa-pills",
                desc: "Receitas médicas",
                endpoint: "/documentos",
                tipoDocumento: "Receita",
                cols: ["Paciente", "Tipo", "Conteúdo", "Data", "Status", "Ações"],
                form: [
                    { id: "pacienteId", label: "Paciente", type: "select-pacientes", required: true },
                    { id: "conteudo", label: "Receita", type: "textarea", full: true, required: true },
                    { id: "status", label: "Status", type: "select", options: ["Ativo", "Pendente", "Arquivado"] }
                ]
            }
        };

        let moduloAtual = "prontuarios";
        let dadosBackend = [];
        let dadosFiltrados = [];
        let pacientes = [];
        let editandoId = null;

        window.onload = async () => {

            await carregarPacientes();

            renderizarSidebar();

            carregarModulo(moduloAtual);
        };

        async function carregarPacientes() {

            try {

                const response = await fetch(`${API}/pacientes`);

                const result = await response.json();

                if (result.success) {

                    pacientes = result.data;

                }

            } catch (err) {

                console.error("Erro ao carregar pacientes", err);

            }
        }

        function renderizarSidebar() {

            const sidebar = document.getElementById("sidebarDocs");

            let html = `<div class="sidebar-title">Módulos</div>`;

            for (const [key, mod] of Object.entries(MODULOS)) {

                html += `
                <div class="sidebar-item ${key === moduloAtual ? 'ativo' : ''}" onclick="carregarModulo('${key}')">

                    <div class="sidebar-icon">
                        <i class="fa-solid ${mod.icone}"></i>
                    </div>

                    <div class="sidebar-info">
                        <h4>${mod.nome}</h4>
                        <p>${mod.desc}</p>
                    </div>

                    <span class="sidebar-count" id="count-${key}">0</span>

                </div>
            `;
            }

            sidebar.innerHTML = html;
        }

        async function carregarModulo(key) {

            moduloAtual = key;

            renderizarSidebar();

            document.getElementById("moduleTitle").innerText =
                MODULOS[key].nome;

            mostrarLoading(true);

            try {

                const response = await fetch(`${API}/documentos`);

                const result = await response.json();

                if (!result.success) {

                    throw new Error(result.message);

                }

                dadosBackend = result.data
                    .filter(doc => doc.tipo === MODULOS[key].tipoDocumento)
                    .map(doc => ({

                        id: doc._id,

                        paciente: doc.pacienteId?.nome || "Paciente removido",

                        pacienteId: doc.pacienteId?._id || "",

                        tipo: doc.tipo,

                        conteudo: doc.conteudo,

                        status: doc.status,

                        data: new Date(doc.dataRegistro).toLocaleDateString()

                    }));

                dadosFiltrados = [...dadosBackend];

                renderizarTabela();

                atualizarContadores();

            } catch (err) {

                console.error(err);

                mostrarToast("Erro ao carregar dados", true);

            } finally {

                mostrarLoading(false);

            }
        }

        function atualizarContadores() {

            for (const key of Object.keys(MODULOS)) {

                const tipo = MODULOS[key].tipoDocumento;

                const count = dadosBackend.filter(x => x.tipo === tipo).length;

                const el = document.getElementById(`count-${key}`);

                if (el) {

                    el.innerText = count;

                }
            }
        }

        function renderizarTabela() {

            const thead = document.getElementById("tableHead");

            const tbody = document.getElementById("tableBody");

            const empty = document.getElementById("emptyState");

            const cols = MODULOS[moduloAtual].cols;

            thead.innerHTML =
                `<tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr>`;

            if (dadosFiltrados.length === 0) {

                tbody.innerHTML = "";

                empty.style.display = "block";

                return;
            }

            empty.style.display = "none";

            tbody.innerHTML = dadosFiltrados.map(row => `

            <tr>

                <td>${row.paciente}</td>

                <td>${row.tipo}</td>

                <td>${row.conteudo}</td>

                <td>${row.data}</td>

                <td>
                    <span class="badge badge-success">
                        ${row.status}
                    </span>
                </td>

                <td>

                    <div class="table-actions">

                        <button class="action-btn"
                            onclick="editarItem('${row.id}')">

                            <i class="fa-solid fa-pen"></i>

                        </button>

                        <button class="action-btn delete"
                            onclick="excluirItem('${row.id}')">

                            <i class="fa-solid fa-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

        `).join("");
        }

        function abrirFormulario() {

            editandoId = null;

            const modal = document.getElementById("modalForm");

            const grid = document.getElementById("formGrid");

            const titulo = document.getElementById("modalTitle");

            titulo.innerText =
                `Novo ${MODULOS[moduloAtual].nome}`;

            grid.innerHTML = "";

            MODULOS[moduloAtual].form.forEach(field => {

                let html = `
                <div class="form-group ${field.full ? 'full' : ''}">
            `;

                html += `
                <label>
                    ${field.label}
                </label>
            `;

                if (field.type === "select") {

                    html += `
                    <select id="${field.id}">
                        ${field.options.map(op =>
                        `<option value="${op}">${op}</option>`
                    ).join("")}
                    </select>
                `;

                } else if (field.type === "select-pacientes") {

                    html += `
                    <select id="${field.id}" required>

                        <option value="">
                            Selecione um paciente
                        </option>

                        ${pacientes.map(p => `
                            <option value="${p._id}">
                                ${p.nome}
                            </option>
                        `).join("")}

                    </select>
                `;

                } else if (field.type === "textarea") {

                    html += `
                    <textarea
                        id="${field.id}"
                        rows="4">
                    </textarea>
                `;

                }

                html += `</div>`;

                grid.innerHTML += html;
            });

            modal.classList.add("active");
        }

        async function salvarRegistro(e) {

            e.preventDefault();

            mostrarLoading(true);

            try {

                const pacienteId =
                    document.getElementById("pacienteId").value;

                const conteudo =
                    document.getElementById("conteudo").value;

                const status =
                    document.getElementById("status").value;

                const body = {

                    pacienteId,

                    tipo: MODULOS[moduloAtual].tipoDocumento,

                    conteudo,

                    status

                };

                let response;

                if (editandoId) {

                    response = await fetch(`${API}/documentos/${editandoId}`, {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(body)

                    });

                } else {

                    response = await fetch(`${API}/documentos`, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(body)

                    });

                }

                const result = await response.json();

                if (!result.success) {

                    throw new Error(result.message);

                }

                mostrarToast("Registro salvo!");

                fecharModal();

                carregarModulo(moduloAtual);

            } catch (err) {

                console.error(err);

                mostrarToast("Erro ao salvar", true);

            } finally {

                mostrarLoading(false);

            }
        }

        async function editarItem(id) {

            try {

                mostrarLoading(true);

                const response =
                    await fetch(`${API}/documentos/${id}`);

                const result = await response.json();

                if (!result.success) {

                    throw new Error(result.message);

                }

                const item = result.data;

                abrirFormulario();

                editandoId = id;

                document.getElementById("pacienteId").value =
                    item.pacienteId?._id || "";

                document.getElementById("conteudo").value =
                    item.conteudo || "";

                document.getElementById("status").value =
                    item.status || "Ativo";

                document.getElementById("modalTitle").innerText =
                    `Editar ${MODULOS[moduloAtual].nome}`;

            } catch (err) {

                console.error(err);

                mostrarToast("Erro ao carregar registro", true);

            } finally {

                mostrarLoading(false);

            }
        }

        async function excluirItem(id) {

            if (!confirm("Deseja excluir este registro?")) {
                return;
            }

            mostrarLoading(true);

            try {

                const response =
                    await fetch(`${API}/documentos/${id}`, {

                        method: "DELETE"

                    });

                const result = await response.json();

                if (!result.success) {

                    throw new Error(result.message);

                }

                mostrarToast("Registro removido!");

                carregarModulo(moduloAtual);

            } catch (err) {

                console.error(err);

                mostrarToast("Erro ao excluir", true);

            } finally {

                mostrarLoading(false);

            }
        }

        function filtrarDados(busca = "") {

            const termo = busca.toLowerCase();

            const statusFiltro =
                document.getElementById("filtroStatus").value;

            dadosFiltrados = dadosBackend.filter(row => {

                const matchBusca =
                    Object.values(row)
                        .some(val =>
                            String(val)
                                .toLowerCase()
                                .includes(termo)
                        );

                const matchStatus =
                    !statusFiltro ||
                    row.status.toLowerCase() ===
                    statusFiltro.toLowerCase();

                return matchBusca && matchStatus;
            });

            renderizarTabela();
        }

        function fecharModal() {

            document
                .getElementById("modalForm")
                .classList.remove("active");
        }

        function mostrarLoading(show) {

            document
                .getElementById("loadingOverlay")
                .classList.toggle("active", show);
        }

        function mostrarToast(msg, isError = false) {

            const toast =
                document.getElementById("toast");

            document.getElementById("toastMsg")
                .innerText = msg;

            toast.className =
                `toast ${isError ? 'error' : ''} show`;

            setTimeout(() => {

                toast.classList.remove("show");

            }, 3000);
        }

        function exportarDados() {

            mostrarToast("Exportação iniciada...");
        }

        function sair() {

            localStorage.removeItem("usuario");

            localStorage.removeItem("token");

            window.location.href = "dashboard.html";
        }
    </script>
</body>
