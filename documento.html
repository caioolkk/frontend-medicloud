<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos | Medi CLOUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Layout */
        .layout-docs {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar-docs {
            width: 280px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            height: calc(100vh - 70px);
            position: sticky;
            top: 70px;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 10px 0 5px 10px;
            font-weight: 600;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .sidebar-item:hover {
            background: var(--primary-light);
            border-color: #dbeafe;
        }

        .sidebar-item.ativo {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .sidebar-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .sidebar-info {
            flex: 1;
        }

        .sidebar-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .sidebar-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .sidebar-count {
            background: var(--border);
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Main Content */
        .main-docs {
            flex: 1;
            padding: 24px;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .module-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .module-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: var(--radius);
            border: none;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .btn-icon {
            padding: 8px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-icon:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Filters & Search */
        .filters-bar {
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .filter-select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            color: var(--text-main);
            cursor: pointer;
        }

        /* Table */
        .data-table-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .table-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .action-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        /* Form Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            transform: translateY(10px);
            transition: var(--transition);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* Loading & Toast */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: var(--transition);
        }

        .loading-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--success);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast-icon {
            font-size: 1.2rem;
            color: var(--success);
        }

        .toast.error .toast-icon {
            color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        @media (max-width: 900px) {
            .sidebar-docs {
                width: 70px;
                padding: 20px 10px;
            }

            .sidebar-info,
            .sidebar-count {
                display: none;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check toast-icon"></i>
        <span id="toastMsg">Operação realizada com sucesso!</span>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalForm">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Registro</h3>
                <button class="modal-close" onclick="fecharModal()">&times;</button>
            </div>
            <form id="formDinamico" onsubmit="salvarRegistro(event)">
                <div class="form-grid" id="formGrid"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="layout-docs">
        <!-- Sidebar -->
        <aside class="sidebar-docs" id="sidebarDocs">
            <div class="sidebar-title">Módulos</div>
            <!-- Renderizado via JS -->
        </aside>

        <!-- Main Content -->
        <main class="main-docs">
            <div class="module-header">
                <h2 id="moduleTitle">Prontuários</h2>
                <div class="module-actions">
                    <button class="btn btn-secondary" onclick="exportarDados()"><i class="fa-solid fa-download"></i>
                        Exportar</button>
                    <button class="btn btn-primary" onclick="abrirFormulario()"><i class="fa-solid fa-plus"></i>
                        Novo</button>
                </div>
            </div>

            <div class="filters-bar">
                <input type="text" class="search-input" placeholder="Buscar por nome, código ou descrição..."
                    oninput="filtrarDados(this.value)">
                <select class="filter-select" id="filtroStatus" onchange="filtrarDados()">
                    <option value="">Todos os status</option>
                    <option value="ativo">Ativo</option>
                    <option value="pendente">Pendente</option>
                    <option value="arquivado">Arquivado</option>
                </select>
                <select class="filter-select" id="filtroData" onchange="filtrarDados()">
                    <option value="">Período</option>
                    <option value="7">Últimos 7 dias</option>
                    <option value="30">Últimos 30 dias</option>
                    <option value="90">Últimos 3 meses</option>
                </select>
            </div>

            <div class="data-table-container">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <i class="fa-regular fa-folder-open"></i>
                    <h3>Nenhum registro encontrado</h3>
                    <p>Adicione um novo registro ou ajuste os filtros.</p>
                </div>
            </div>
        </main>
        <div class="logout-btn" onclick="sair()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const API_BASE = 'https://medicloud-backend-wy7s.onrender.com';

        // ============ FUNÇÕES QUE O HTML CHAMA ============

        // Esta é a função que o botão "Novo" está chamando!
        function abrirFormulario() {
            console.log('🔘 abrirFormulario() chamado');

            const modal = document.getElementById('modalNovoDocumento') ||
                document.querySelector('.modal') ||
                document.querySelector('[id*="modal"]') ||
                document.querySelector('div[class*="modal"]');

            if (modal) {
                modal.style.display = 'flex';
                console.log('✅ Modal aberto');
                carregarPacientesNoSelect(); // Carrega pacientes no dropdown
            } else {
                console.error('❌ Modal não encontrado!');
                // Tenta criar alert se não achar modal
                alert('Modal não encontrado. Verifique se o ID está correto.');
            }
        }

        function fecharModal() {
            const modal = document.getElementById('modalNovoDocumento') ||
                document.querySelector('.modal');
            if (modal) {
                modal.style.display = 'none';
                const form = document.getElementById('formNovoDocumento') || document.querySelector('form');
                if (form) form.reset();
                console.log('✅ Modal fechado');
            }
        }

        // Função de filtro que o HTML chama
        function filtrarDados() {
            console.log('🔍 filtrarDados() chamado');
            aplicarFiltros();
        }

        // ============ CARREGAR PACIENTES NO SELECT ============
        async function carregarPacientesNoSelect() {
            try {
                console.log('📥 Carregando pacientes para o select...');
                const res = await fetch(`${API_BASE}/api/pacientes`);
                const { data, success } = await res.json();

                const select = document.querySelector('select[name="pacienteId"]');
                if (select && success && data) {
                    select.innerHTML = '<option value="">Selecione um paciente</option>' +
                        data.map(p => `<option value="${p._id}">${p.nome}</option>`).join('');
                    console.log('✅ Pacientes carregados:', data.length);
                } else if (!select) {
                    console.warn('⚠️  Select pacienteId não encontrado');
                }
            } catch (err) {
                console.error('❌ Erro ao carregar pacientes:', err);
            }
        }

        // ============ CARREGAR DOCUMENTOS ============
        async function carregarDocumentos(filtros = {}) {
            try {
                const params = new URLSearchParams();
                if (filtros.status) params.append('status', filtros.status);
                if (filtros.periodo) params.append('periodo', filtros.periodo);

                const url = `${API_BASE}/api/documentos?${params}`;
                console.log('📥 GET:', url);

                const res = await fetch(url);

                // Verifica se é JSON ou HTML de erro
                const contentType = res.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await res.text();
                    console.error('❌ Resposta não é JSON:', text.substring(0, 100));
                    throw new Error('Servidor retornou HTML em vez de JSON. Status: ' + res.status);
                }

                const json = await res.json();
                console.log('📦 API response:', json);

                const tbody = document.querySelector('table tbody') ||
                    document.querySelector('[id*="lista"]') ||
                    document.querySelector('tbody');

                if (!tbody) {
                    console.error('❌ tbody não encontrado');
                    return;
                }

                if (!json.success || !json.data || json.data.length === 0) {
                    tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center; padding:20px; color:#999;">
            Nenhum registro encontrado<br>
            <small>Adicione um novo registro ou ajuste os filtros.</small>
          </td>
        </tr>
      `;
                    return;
                }

                tbody.innerHTML = json.data.map(doc => `
      <tr>
        <td><strong>${doc.tipo || '-'}</strong></td>
        <td>${doc.pacienteId?.nome || 'Paciente não vinculado'}</td>
        <td>${new Date(doc.dataRegistro).toLocaleDateString('pt-BR')}</td>
        <td><span style="background:#e8f5e9; color:#2e7d32; padding:4px 8px; border-radius:4px; font-size:12px;">${doc.status || 'Ativo'}</span></td>
        <td>
          <button onclick="editarDocumento('${doc._id}')" style="background:none; border:none; cursor:pointer; font-size:16px;">✏️</button>
          <button onclick="excluirDocumento('${doc._id}')" style="background:none; border:none; cursor:pointer; font-size:16px; color:#d32f2f; margin-left:8px;">🗑️</button>
        </td>
      </tr>
    `).join('');

            } catch (err) {
                console.error('❌ Erro ao carregar documentos:', err);
                alert('Erro ao carregar documentos: ' + err.message);
            }
        }

        // ============ SALVAR DOCUMENTO ============
        async function salvarDocumento(e) {
            if (e) e.preventDefault();
            console.log('💾 salvarDocumento() chamado');

            // Coleta dados do form
            const dados = {
                pacienteId: document.querySelector('select[name="pacienteId"]')?.value,
                tipo: document.querySelector('select[name="tipo"]')?.value,
                conteudo: document.querySelector('textarea[name="conteudo"]')?.value ||
                    document.querySelector('textarea')?.value || '',
                status: document.querySelector('select[name="status"]')?.value || 'Ativo'
            };

            console.log('📋 Dados:', dados);

            if (!dados.pacienteId) {
                alert('⚠️ Selecione um paciente!');
                return;
            }

            if (!dados.tipo) {
                alert('⚠️ Selecione o tipo de documento!');
                return;
            }

            try {
                console.log('📤 POST /api/documentos');
                const res = await fetch(`${API_BASE}/api/documentos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const result = await res.json();
                console.log('📥 Resposta:', result);

                if (res.ok && result.success) {
                    alert('✅ Documento salvo!');
                    fecharModal();
                    carregarDocumentos();
                } else {
                    alert('❌ ' + (result.message || 'Erro ao salvar'));
                }
            } catch (err) {
                console.error('❌ Erro de conexão:', err);
                alert('❌ Erro de conexão: ' + err.message);
            }
        }

        // ============ FILTROS ============
        function aplicarFiltros() {
            const statusSelect = document.querySelector('select[name="statusFiltro"]') ||
                document.querySelector('select[name="status"]');
            const periodoSelect = document.querySelector('select[name="periodo"]');

            const filtros = {
                status: statusSelect?.value || '',
                periodo: periodoSelect?.value || ''
            };

            // Remove vazios
            Object.keys(filtros).forEach(k => filtros[k] === '' && delete filtros[k]);

            console.log('🔍 Aplicando filtros:', filtros);
            carregarDocumentos(filtros);
        }

        // ============ EDITAR / EXCLUIR ============
        async function editarDocumento(id) {
            console.log('✏️ Editar documento:', id);
            alert('Função de edição em desenvolvimento. ID: ' + id);
        }

        async function excluirDocumento(id) {
            if (!confirm('Excluir este documento?')) return;

            try {
                const res = await fetch(`${API_BASE}/api/documentos/${id}`, { method: 'DELETE' });
                const result = await res.json();

                if (result.success) {
                    alert('✅ Documento removido!');
                    carregarDocumentos();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (err) {
                alert('❌ Erro ao excluir');
            }
        }

        // ============ INICIALIZAÇÃO ============
        document.addEventListener('DOMContentLoaded', () => {
            console.log('✅ Documento.html carregado');

            // Carrega lista inicial
            carregarDocumentos();

            // Vincula selects de filtro
            document.querySelectorAll('select[name="statusFiltro"], select[name="status"], select[name="periodo"]').forEach(sel => {
                sel.addEventListener('change', () => {
                    console.log('🔄 Select mudou:', sel.name, sel.value);
                    aplicarFiltros();
                });
            });

            // Vincula formulário
            const form = document.getElementById('formNovoDocumento') || document.querySelector('form');
            if (form) {
                form.addEventListener('submit', salvarDocumento);
                console.log('📝 Form vinculado a salvarDocumento');
            }

            // Botão "Novo" ou "+" - tenta vários seletores
            document.querySelectorAll('button, a').forEach(btn => {
                const text = btn.textContent.toLowerCase();
                if (text.includes('novo') || text.includes('+') || btn.id?.includes('novo')) {
                    btn.addEventListener('click', (e) => {
                        console.log('🔘 Botão Novo clicado');
                        if (btn.tagName === 'A') e.preventDefault();
                        abrirFormulario();
                    });
                }
            });

            // Botão "Cancelar"
            document.querySelectorAll('button[type="button"]').forEach(btn => {
                if (btn.textContent.toLowerCase().includes('cancelar')) {
                    btn.addEventListener('click', fecharModal);
                }
            });

            // Fechar modal ao clicar fora
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) fecharModal();
                });
            });
        });

        // Exportar funções globais (para onclick no HTML)
        window.abrirFormulario = abrirFormulario;
        window.fecharModal = fecharModal;
        window.filtrarDados = filtrarDados;
        window.carregarDocumentos = carregarDocumentos;
        window.aplicarFiltros = aplicarFiltros;
        window.salvarDocumento = salvarDocumento;
        window.editarDocumento = editarDocumento;
        window.excluirDocumento = excluirDocumento;
    </script>
</body>

</html>
